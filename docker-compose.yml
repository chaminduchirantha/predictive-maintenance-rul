services:
  predictamaint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictamaint-app
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
